name: Supabase Keep-Alive

# Evita que o projeto Supabase (free) pause por inatividade. Faz um GET leve
# no REST a cada 3 dias (margem sobre os ~7 dias de inatividade que disparam a
# pausa). Uma requisicao ja conta como atividade.

on:
  schedule:
    - cron: '0 12 */3 * *'   # a cada 3 dias, ~09h BRT
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          KEY=$(printf '%s' "$SUPABASE_SERVICE_KEY" | tr -d '[:space:]')
          echo "Pingando $URL ..."
          curl -fsS "$URL/rest/v1/prevdow_history?select=data_base&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -o /dev/null \
          && echo "Keep-alive OK"
