name: PrevDow One-shot

# Workflow temporario: roda check_prevdow.py uma vez quando este arquivo e
# alterado/empurrado para a main. Usado para capturar um mes especifico sem
# depender do cron ou de workflow_dispatch. Remover apos o uso.
# retry: strip de secrets + diagnostico de host (Maio/2026)
# retry 2: apos resume do projeto Supabase
# retry 3: modo manual (portal bloqueia runner com 403) — valores do portal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prevdow-oneshot.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install supabase requests beautifulsoup4

      - name: Run PrevDow check (force)
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST:             ${{ secrets.SMTP_HOST }}
          SMTP_PORT:             ${{ secrets.SMTP_PORT }}
          SMTP_USER:             ${{ secrets.SMTP_USER }}
          SMTP_PASS:             ${{ secrets.SMTP_PASS }}
          SMTP_FROM:             ${{ secrets.SMTP_FROM }}
          NOTIFY_EMAIL:          ${{ secrets.SMTP_USER }}
          FORCE_RUN:             '1'
          # Portal bloqueia o runner (403); insere Maio/2026 com os numeros do portal
          MANUAL_DATA_BASE:      '05/2026'
          MANUAL_CDI_MONTH:      '1.01'
          MANUAL_BALANCED_MONTH: '0.04'
          MANUAL_CDI_YEAR:       '5.32'
          MANUAL_BALANCED_YEAR:  '4.12'
        run: python check_prevdow.py
