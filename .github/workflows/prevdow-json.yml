name: PrevDow Auto-Update

# Atualizacao AUTOMATICA e autossuficiente do PrevDow (sem Supabase):
#   scraper (Playwright, fura o Akamai)  ->  data/prevdow_latest.json  ->
#   commit/push  ->  Streamlit Cloud redeploya  ->  app mostra o novo mes.
#
# Mesma janela do portal: varredura horaria no dia 15 e 1x/dia nos dias 16-28
# (o portal publica o mes anterior tipicamente entre os dias 15-20).
# BRT = UTC-3.

on:
  schedule:
    - cron: '0 9-23 15 * *'    # dia 15, 06h-20h BRT (de hora em hora)
    - cron: '0 0-2 16 * *'     # dia 15, 21h-23h BRT (vira dia 16 UTC)
    - cron: '0 12 16-28 * *'   # dias 16-28, 09h BRT (fallback diario)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Update PrevDow file
        run: python update_prevdow_file.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/prevdow_latest.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/prevdow_latest.json
            git commit -m "Auto: PrevDow atualizado ($(date -u +%Y-%m-%d))"
            git push
            echo "PrevDow atualizado e empurrado."
          else
            echo "Sem mudancas no PrevDow."
          fi
